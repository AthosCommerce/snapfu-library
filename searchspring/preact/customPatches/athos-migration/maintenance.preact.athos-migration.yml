version: athos-migration
description: 'Migrates a Searchspring site to Athos Commerce'

steps:
    - run: |
        mkdir -p ./.github/workflows && cp ./patch/deploy.yml ./.github/workflows/deploy.yml
        cp ./patch/babel.config.js ./babel.config.js
        cp ./patch/webpack.common.js ./webpack.common.js
        cp ./patch/webpack.dev.js ./webpack.dev.js
        cp ./patch/webpack.modern.js ./webpack.modern.js
        cp ./patch/webpack.universal.js ./webpack.universal.js
        mkdir -p ./tests/cypress/support && cp ./patch/cypress/support/commands.js ./tests/cypress/support/commands.js
        mkdir -p ./tests/cypress/support && cp ./patch/cypress/support/e2e.js ./tests/cypress/support/e2e.js
    - files:
        package.json:
            action: find-replace
            changes:
                - replace: 
                    pattern: '"searchspring": {'
                    replacement: '"athos": {'
    - files:
        package.json:
            action: edit-json
            changes:
                - remove:
                    path: ['dependencies', '@searchspring/snap-preact']
                - remove:
                    path: ['dependencies', '@searchspring/snap-preact-components']
                - remove:
                    path: ['dependencies', 'mobx-react']
                - remove:
                    path: ['dependencies', 'preact']
                - remove:
                    path: ['dependencies', 'mobx']
                - update:
                    properties: {
                        dependencies: {
                            "@athoscommerce/snap-preact": "1.17.0",
                            "mobx": "6.15.1",
                            "mobx-react-lite": "4.1.1",
                            "preact": "10.28.4"
                        },
                    }
                - update:
                    path: ['athos', 'version']
                    value: '1.17.0'
                - update:
                    properties:
                        "scripts": {
                            "dev": "webpack serve --config webpack.dev.js",
                            "test": "concurrently -k -s first -n dev,cypress \"webpack serve --config webpack.dev.js\" \"wait-on tcp:localhost:3333 && (cypress run --project tests || cypress run --project tests)\""
                        }
                - remove:
                    path: ['devDependencies', 'kill-port']
                # pin devDependencies to exact versions (matches snapfu-scaffold-preact at 1.17.0)
                - update:
                    properties:
                        "devDependencies": {
                            "@babel/core": "7.29.13",
                            "@babel/eslint-parser": "7.29.13",
                            "@babel/plugin-proposal-class-properties": "7.18.6",
                            "@babel/plugin-proposal-decorators": "7.29.7",
                            "@babel/plugin-transform-react-jsx": "7.29.7",
                            "@babel/plugin-transform-runtime": "7.29.7",
                            "@babel/preset-env": "7.29.7",
                            "@babel/preset-react": "7.29.7",
                            "@babel/runtime": "7.29.13",
                            "@lhci/cli": "0.15.1",
                            "@searchspring/browserslist-config-snap": "1.0.7",
                            "@searchspring/prettier": "1.0.2",
                            "babel-loader": "9.2.1",
                            "concurrently": "9.2.5",
                            "core-js": "3.51.0",
                            "css-loader": "6.11.0",
                            "cypress": "13.17.0",
                            "cypress-fail-fast": "7.1.1",
                            "eslint": "8.57.1",
                            "file-loader": "6.2.0",
                            "husky": "8.0.3",
                            "lint-staged": "13.3.0",
                            "prettier": "2.8.8",
                            "sass": "1.78.0",
                            "sass-loader": "13.3.3",
                            "style-loader": "3.3.4",
                            "wait-on": "8.0.5",
                            "webpack": "5.112.2",
                            "webpack-bundle-analyzer": "4.10.2",
                            "webpack-cli": "5.1.4",
                            "webpack-dev-server": "4.15.2",
                            "webpack-merge": "5.10.0"
                        }
        src/**:
            action: find-replace
            changes:
                - replace: 
                    pattern: \@searchspring\/snap-preact-components
                    replacement: '@athoscommerce/snap-preact/components'
                - replace: 
                    pattern: \@searchspring\/snap-
                    replacement: '@athoscommerce/snap-'
                - replace: 
                    pattern: \'mobx-react\'
                    replacement: "'mobx-react-lite'"
                - replace: 
                    pattern: \"mobx-react\"
                    replacement: "'mobx-react-lite'"
        '**/*.*':
            action: find-replace
            changes:
                - replace: 
                    pattern: window.searchspring
                    replacement: window.athos
                - replace: 
                    pattern: window?.searchspring
                    replacement: window?.athos
    - run: |
        npm run clean
        bash ./patch/file-checks.sh
