version: 1.13.1
description: 'use kill-the-port in dev script to support Windows'

steps:
    - files:
        package.json:
            action: edit-json
            changes:
                - update:
                    properties:
                        "scripts": {
                            "dev": "kill-the-port 3333 && webpack serve --config webpack.dev.js"
                        }
                - update:
                    properties:
                        "devDependencies": {
                            "kill-the-port": "0.1.3"
                        }
                - remove:
                    path: ['devDependencies', 'kill-port']

