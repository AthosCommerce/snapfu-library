version: 1.13.1
description: 'copy new webpack dev file, replace test script with concurrently and wait-on'

steps:
    - run: |
        cp ./patch/snap/webpack.dev.js ./webpack.dev.js
    - files:
        package.json:
            action: edit-json
            changes:
                - update:
                    properties:
                        "scripts": {
                            "test": "concurrently -k -s first -n dev,cypress \"webpack serve --config webpack.dev.js\" \"wait-on tcp:localhost:3333 && (cypress run --project tests || cypress run --project tests)\""
                        }
                - update:
                    properties:
                        "devDependencies": {
                            "concurrently": "^9.2.4",
                            "wait-on": "^8.0.5"
                        }
