version: 1.17.0
description: 'pin devDependencies to exact versions'

steps:
    - files:
        package.json:
            action: edit-json
            changes:
                # pin devDependencies to exact versions (latest within the ranges used by the scaffolds)
                - update:
                    properties:
                        "devDependencies": {
                            "@babel/core": "7.29.13",
                            "@babel/plugin-transform-react-jsx": "7.29.7",
                            "@babel/plugin-transform-runtime": "7.29.7",
                            "@babel/preset-env": "7.29.7",
                            "@babel/preset-react": "7.29.7",
                            "@babel/runtime": "7.29.13",
                            "@lhci/cli": "0.15.1",
                            "@searchspring/browserslist-config-snap": "1.0.7",
                            "@searchspring/prettier": "1.0.2",
                            "@typescript-eslint/parser": "8.72.1",
                            "babel-loader": "10.1.1",
                            "core-js": "3.51.0",
                            "css-loader": "7.1.5",
                            "eslint": "9.39.5",
                            "eslint-plugin-react": "7.37.5",
                            "husky": "9.1.7",
                            "lint-staged": "16.4.0",
                            "prettier": "3.9.10",
                            "ts-loader": "9.5.4",
                            "typescript-eslint": "8.72.1",
                            "webpack": "5.112.2",
                            "webpack-bundle-analyzer": "5.4.1",
                            "webpack-cli": "6.0.1",
                            "webpack-dev-server": "5.2.7",
                            "webpack-merge": "6.0.1",
                            "whatwg-fetch": "3.6.20"
                        }
