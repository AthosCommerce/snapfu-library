version: 1.12.0
description: 'use kill-port in test script to support Windows'

steps:
    - files:
        package.json:
            action: edit-json
            changes:
                - update:
                    properties:
                        "scripts": {
                            "test": "kill-port 3333 8888 && webpack serve --config webpack.dev.js & ((cypress run --project tests || cypress run --project tests) && kill-port 3333 8888)"
                        }
